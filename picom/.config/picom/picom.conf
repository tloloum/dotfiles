# picom (v10) — compositeur : fondus, fenêtres inactives assombries,
# coins arrondis + ombres seulement pour ce qui flotte (fenêtres tuilées : carrées, bord à bord).
# Pas de flou. Relancé par ~/.config/picom/launch.sh (exec_always d'i3).

backend = "glx";
vsync = true;
use-ewmh-active-win = true;   # fenêtre active = celle d'i3 (_NET_ACTIVE_WINDOW)
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# ── fondus : apparition / disparition rapides (~80 ms) ───────────────────────
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;
fade-exclude = [
  "class_g = 'flameshot'"
];

# ── fenêtres inactives légèrement assombries ─────────────────────────────────
inactive-dim = 0.12;
# jamais assombris : barre, menus, popups, notifications, captures
focus-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Eww'",
  "class_g = 'Dunst'",
  "class_g = 'flameshot'",
  "window_type = 'dock'",
  "window_type = 'notification'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'"
];

# ── ce qui flotte : coins arrondis + ombre ───────────────────────────────────
# flottant = fenêtre flottante d'i3 (I3_FLOATING_WINDOW) ou menu/popup/notification
corner-radius = 10;
rounded-corners-exclude = [
  "! I3_FLOATING_WINDOW@:c = 1 && class_g != 'Rofi' && class_g != 'Eww' && class_g != 'Dunst'",
  "class_g = 'Polybar'",
  "class_g = 'flameshot'"
];

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [
  "! I3_FLOATING_WINDOW@:c = 1 && class_g != 'Rofi' && class_g != 'Eww' && class_g != 'Dunst'",
  "class_g = 'Polybar'",
  "class_g = 'flameshot'",
  "_GTK_FRAME_EXTENTS@:c"
];

# pas de flou
blur-background = false;

wintypes: {
  tooltip       = { fade = true; shadow = false; focus = true; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
};
