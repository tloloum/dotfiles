# ===================================================================
# ~/.config/ranger/rc.conf  —  SURCHARGES personnelles uniquement.
#
# Ranger charge TOUJOURS sa config par défaut interne, PUIS ce fichier
# par-dessus. Inutile de recopier les 600 lignes par défaut : on ne met
# ici que ce qu'on veut changer ou ajouter.
#
# ATTENTION : pas de commentaire en fin de ligne sur un `set` !
# Le `#` serait avalé dans la valeur. Les commentaires sont sur leur
# propre ligne.
# ===================================================================

# --- Apparence -----------------------------------------------------
# Largeur relative des 3 colonnes : parent | courant | aperçu.
set column_ratios 1,2,3
# Trait vertical entre les colonnes (none / separators / outline / both).
set draw_borders separators
# Coupe les noms trop longs avec « … » (1 char) au lieu de "..." (3 chars).
set unicode_ellipsis true
# Numéros de ligne relatifs, façon vim (false / absolute / relative).
set line_numbers relative
# La ligne courante affiche 0 au lieu de son numéro absolu.
set relative_current_zero true
# Retour à la ligne des aperçus texte au lieu de tronquer.
set wrap_plaintext_previews true
# Thème couleurs perso (colorschemes/tof.py) : colonne active bien visible.
set colorscheme tof

# --- Aperçu d'images (alacritty ne sait ni kitty ni sixel) --------
# Installe d'abord `ueberzugpp`, puis passe preview_images à true.
set preview_images false
set preview_images_method ueberzug

# --- Fichiers cachés ----------------------------------------------
# Affiche les dotfiles au démarrage (toggle avec zh).
set show_hidden true
# Regex des fichiers considérés « cachés ».
set hidden_filter ^\.|\.(pyc|pyo|swp)$|^__pycache__$|^lost\+found$

# --- Confort & sécurité -------------------------------------------
# Confirme la suppression seulement si plusieurs fichiers (always/never).
set confirm_on_delete multiple
# N'essaie pas de prévisualiser un fichier > 10 Mio (0 = pas de limite).
set preview_max_size 10485760
# Garde 5 lignes de marge en haut/bas en scrollant.
set scroll_offset 5
# Persiste l'historique des commandes « : » entre les sessions.
set save_console_history true
# Compte le nb de fichiers de chaque dossier (affiché à droite).
set automatically_count_files true
# Ouvre tout le dossier dans feh/sxiv, pas juste le fichier sous le curseur.
set open_all_images true
# Active molette + clics.
set mouse_enabled true

# --- Options par dossier (setlocal) -------------------------------
# Dans ces dossiers uniquement : tri par date de modif décroissante.
setlocal path=~/Downloads       sort mtime
setlocal path=~/Téléchargements sort mtime

# ===================================================================
# == Keybindings supplémentaires
# ===================================================================
# DD : suppression directe (confirmation selon confirm_on_delete).
map DD console delete
# E : ouvre dans $EDITOR (mets EDITOR=nvim dans ton zsh !).
map E edit
# Ctrl-F : saut fuzzy avec fzf (voir commands.py).
map <C-f> fzf_select
# x : extrait l'archive sous le curseur (nécessite `atool`).
map x shell -w extract %f
