# généré par ~/.config/theme/apply depuis colors.json — ne pas éditer
[urgency_low]
    background = "#0b0b0b"
    foreground = "#6e6e6e"
    frame_color = "#1e1e1e"
    highlight = "#6e6e6e"

[urgency_normal]
    background = "#0b0b0b"
    foreground = "#bdbdbd"
    frame_color = "#3a3a3a"
    highlight = "#e6e6e6"

[urgency_critical]
    background = "#0b0b0b"
    foreground = "#e6e6e6"
    frame_color = "#c4605a"
    highlight = "#c4605a"
