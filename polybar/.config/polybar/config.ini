;; Polybar — première version (structure inspirée de awhitehouse104/polybar)
;; Lancée par ./launch.sh depuis la config i3 (exec_always).

; couleurs : générées depuis ~/.config/theme/colors.json (~/.config/theme/apply)
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 20pt
bottom = false
monitor = ${env:MONITOR:}

background = ${colors.background-transparent}
foreground = ${colors.foreground}

line-size = 3pt
padding-left = 0
padding-right = 1
module-margin = 1

; séparateurs placés à la main (module/sep) pour pouvoir grouper wifi + bluetooth

font-0 = CaskaydiaCove Nerd Font:size=10;2
; icônes mises en avant (module power)
font-1 = CaskaydiaCove Nerd Font:size=13;3

modules-left = i3 sep launcher sep keybinds
modules-center = focused
; tiroir : la flèche (module/drawer) déplie/replie les stats système, masquées au démarrage
modules-right = drawer filesystem sep-drawer memory sep-drawer2 cpu sep-drawer3 temperature sep updates sep pulseaudio sep date sep battery sep network bluetooth sep power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; laisse i3 réserver la place de la barre
override-redirect = false

[settings]
screenchange-reload = true
pseudo-transparency = true

;; ── workspaces ────────────────────────────────────────────────────────────
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false

; mode i3 actif (ex. « resize »)
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.warn}
label-mode-foreground = ${colors.background}

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.secondary}
label-focused-foreground = ${colors.secondary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.primary}
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

;; ── raccourcis d'applications (à droite des workspaces) ───────────────────
[module/launcher]
type = custom/text
; firefox · terminal · spotify · explorateur de fichiers (nemo)
format = %{A1:firefox &:}󰈹%{A}  %{A1:alacritty &:}󰆍%{A}  %{A1:spotify &:}󰓇%{A}  %{A1:nemo &:}󰉋%{A}
format-font = 2
format-foreground = ${colors.primary}

;; ── appli au focus (centre de la barre) ───────────────────────────────────
[module/focused]
type = custom/script
exec = python3 -u ~/.config/polybar/scripts/focused-app.py
; tail : le script reste lancé et met à jour la barre à chaque événement i3
tail = true
format-foreground = ${colors.secondary}

;; ── recherche d'applis + récap des raccourcis i3 ───────────────────────────────────────────────
[module/keybinds]
type = custom/text
; loupe : lanceur d'applications (comme $mod+space) · clavier : récap des raccourcis i3
; (re-clic sur l'une ou l'autre : ferme le menu ouvert)
format = %{A1:pkill -x rofi || rofi -show drun -theme launcher &:}󰍉%{A}  %{A1:pkill -x rofi || ~/.config/rofi/scripts/keybinds-menu &:} %{A}
format-font = 2
format-foreground = ${colors.primary}

;; ── tiroir des stats système ──────────────────────────────────────────────
[module/drawer]
type = custom/ipc
; hook-0 = replié (flèche vers la gauche : « ouvrir »), hook-1 = déplié
hook-0 = echo ""
hook-1 = echo ""
initial = 1
format-foreground = ${colors.primary}
click-left = ~/.config/polybar/scripts/drawer.sh &

; séparateurs internes au tiroir : masqués/affichés avec les stats
[module/sep-drawer]
inherit = module/sep
hidden = true

[module/sep-drawer2]
inherit = module/sep-drawer

[module/sep-drawer3]
inherit = module/sep-drawer

;; ── système ───────────────────────────────────────────────────────────────
[module/filesystem]
hidden = true
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %free%

[module/memory]
hidden = true
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.primary}
; %total% = capacité réelle de la machine → pas de valeur en dur
label = %used%

[module/cpu]
hidden = true
type = internal/cpu
interval = 2
; clic : popup eww avec la charge de chaque cœur virtuel (façon htop) ; re-clic : le ferme
; icône (gris : format-foreground) + pourcentage (label-foreground), tout cliquable
format = %{A1:~/.config/eww/scripts/toggle-cpu.sh &:} <label>%{A}
format-foreground = ${colors.primary}
label-foreground = ${colors.foreground}
label = %percentage:2%%

[module/temperature]
hidden = true
type = internal/temperature
interval = 3
; chemin du capteur k10temp (Tctl), calculé par launch.sh car l'index hwmonN change au boot
hwmon-path = ${env:POLYBAR_HWMON:}
warn-temperature = 75
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

;; ── réseau (wifi) ─────────────────────────────────────────────────────────
[module/network]
type = internal/network
; détecte l'interface wifi tout seul (wlp2s0 ici)
interface-type = wireless
interval = 3

; icône seule, qui évolue avec le signal
; clic : ouvre le menu wifi rofi (~/.config/rofi/scripts/wifi-menu) ; re-clic : le ferme
; (sans ça, un 2e clic lançait un 2e rofi → « Rofi already running? »)
format-connected = %{A1:pkill -x rofi || ~/.config/rofi/scripts/wifi-menu &:}<ramp-signal>%{A}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

format-disconnected = %{A1:pkill -x rofi || ~/.config/rofi/scripts/wifi-menu &:}<label-disconnected>%{A}
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.alert}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth-status.sh
interval = 3
; clic : ouvre le menu rofi (~/.config/rofi/scripts/bluetooth-menu) ; re-clic : le ferme
click-left = pkill -x rofi || ~/.config/rofi/scripts/bluetooth-menu &

[module/sep]
type = custom/text
format = |
format-foreground = ${colors.disabled}

;; ── mises à jour système ──────────────────────────────────────────────────
[module/updates]
type = custom/script
; repos : icône + nb de mises à jour apt · en cours : barre de progression
exec = python3 -u ~/.config/polybar/scripts/updates.py
tail = true
; clic : lance la mise à jour (mot de passe via polkit) ; pendant la mise à jour : ouvre le journal
click-left = ~/.config/polybar/scripts/updates-click.sh &
; clic droit : recompte tout de suite
click-right = pkill -USR1 -f polybar/scripts/updates.py

;; ── alimentation ──────────────────────────────────────────────────────────
[module/power]
type = custom/text
format = 
format-font = 1
format-foreground = ${colors.secondary}
; clic : menu verrouiller / redémarrer / éteindre (re-clic : le ferme)
click-left = pkill -x rofi || ~/.config/rofi/scripts/power-menu &

;; ── son / batterie / heure ────────────────────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

; clic : popup média eww (lecteur, visualiseur, volume, sorties) · scroll : volume (natif)
format-volume = %{A1:~/.config/eww/scripts/toggle-media.sh &:}<ramp-volume> <bar-volume>%{A}
format-muted = %{A1:~/.config/eww/scripts/toggle-media.sh &:}<label-muted>%{A}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}

; barre de volume à la place du pourcentage
bar-volume-width = 10
bar-volume-indicator =
bar-volume-fill = ━
bar-volume-foreground-0 = ${colors.foreground}
bar-volume-empty = ━
bar-volume-empty-foreground = ${colors.disabled}

label-muted = 󰖁 ━━━━━━━━━━
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.warn}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.success}

format-low = <label-low>
format-low-prefix = " "
format-low-foreground = ${colors.alert}
label-low = %percentage%%

format-full-prefix = " "
format-full-prefix-foreground = ${colors.success}
label-full = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
; clic : bascule vers la date complète
date-alt = %d-%m-%Y %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %date%

