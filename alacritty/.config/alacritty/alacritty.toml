import = ["~/.config/alacritty/themes/themes/catppuccin_mocha.toml"]

[env]
TERM="xterm-256color"


[window]
padding = { x = 5, y = 5}
opacity = 0.95              
decorations = "None"        
dynamic_title = true

[font]
size = 8

[font.normal]
family = "Fantasque Sans Mono"
style  = "Regular"

[font.bold]
family = "Fantasque Sans Mono"
style  = "Bold"

[font.italic]
family = "Fantasque Sans Mono"
style  = "Italic"

[font.bold_italic]
family = "Fantasque Sans Mono"
style  = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

