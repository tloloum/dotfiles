import = ["~/.config/alacritty/themes/themes/catppuccin_mocha.toml"]

[env]
TERM="xterm-256color"


[window]
padding = { x = 5, y = 5}
opacity = 0.95              
decorations = "None"        
dynamic_title = true

[font]
normal = { family = "Fanstasque Sans Mono", style = "Regular" }
bold   = { family = "Fanstasque Sans Mono", style = "Bold" }
italic = { family = "Fanstasque Sans Mono", style = "Italic" }
size = 8

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

option_as_alt = "Both"
